# Realistic workloads in team-a for the Kubernetes UI (T-0377, KIND-2). Images are small, pinned and fully qualified
# (podman needs docker.io/...). The Secret value is obviously fake (CLAUDE.md rule 5).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: team-a
data:
  LOG_LEVEL: info
  GREETING: hello from kind
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: team-a
type: Opaque
# base64 of "fake-password-not-a-secret". `data`, not `stringData`: client-side apply re-patches stringData on every
# run, which would break the "second `up` is a no-op" guarantee.
data:
  password: ZmFrZS1wYXNzd29yZC1ub3QtYS1zZWNyZXQ=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: team-a
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: team-a
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
# No ingress controller is installed; the object only needs to exist for the UI.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: team-a
spec:
  rules:
    - host: web.team-a.kind.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
---
# Headless governing Service for the StatefulSet (serviceName: db) so db-0 gets its stable DNS name.
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: team-a
spec:
  clusterIP: None
  selector:
    app: db
  ports:
    - name: placeholder
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: team-a
  labels:
    app: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: docker.io/library/busybox:1.37
          command: ["sh", "-c", "sleep 2147483647"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
  # Spelled out exactly as the API server stores it (apiVersion/kind/volumeMode/status defaults): the template list
  # has no merge key, so any defaulted field missing here makes every re-apply report `configured`.
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        storageClassName: standard
        accessModes: ["ReadWriteOnce"]
        volumeMode: Filesystem
        resources:
          requests:
            storage: 100Mi
      status:
        phase: Pending
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
  namespace: team-a
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: docker.io/library/busybox:1.37
              command: ["sh", "-c", "echo report generated at $(date)"]
              resources:
                requests: { cpu: 5m, memory: 8Mi }
                limits: { memory: 32Mi }
---
# Exits immediately with restartPolicy Always => CrashLoopBackOff and BackOff Warning events in team-a.
apiVersion: v1
kind: Pod
metadata:
  name: crashloop
  namespace: team-a
  labels:
    app: crashloop
spec:
  restartPolicy: Always
  containers:
    - name: crash
      image: docker.io/library/busybox:1.37
      command: ["sh", "-c", "exit 1"]
      resources:
        requests: { cpu: 5m, memory: 8Mi }
        limits: { memory: 16Mi }
