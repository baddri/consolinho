# The consolinho workload (ADR-0030 §Workloads). One pod = init container `migrate` (EF migrations, ADR-0027) +
# container `server` (API + SPA). Both run the same image; overlays rewrite `image: consolinho` via `images:`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consolinho
  labels:
    app.kubernetes.io/component: server
spec:
  # No spec.replicas: the HPA (hpa.yaml) owns the count (ADR-0030 Amendment 2026-11-24; check-deploy.sh enforces).
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/component: server
  # K8S-4: never drop below the desired count; a failed migration blocks the new pod, old pods keep serving (DB-2).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: consolinho
      # Trust for kubernetes.default.svc comes from the mounted CA bundle, so no SA token is needed (K8S-5).
      automountServiceAccountToken: false
      # No runAsUser/fsGroup: the restricted-v2 SCC assigns the namespace's UID range.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Spread the pods over nodes (three on one node would defeat min 3). Labels are written out: kustomize does not
      # inject them here. pod-template-hash limits the skew calculation to the current ReplicaSet during rollouts.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: consolinho
              app.kubernetes.io/component: server
          matchLabelKeys: [pod-template-hash]
      initContainers:
        # ADR-0027: idempotent migrations under an advisory lock, before the server starts. Gets only the DB
        # connection string — no OAuth secret, no DP keys.
        - name: migrate
          image: consolinho
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__consoledb
              valueFrom:
                secretKeyRef:
                  name: consolinho-db
                  key: connection-string
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: server
          image: consolinho
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: consolinho-config
          env:
            - name: ConnectionStrings__consoledb
              valueFrom:
                secretKeyRef:
                  name: consolinho-db
                  key: connection-string
            # Must equal the OAuthClient `consolinho` secret (created together by the script/operator).
            - name: Auth__OpenShift__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: consolinho-oauth
                  key: client-secret
          # Let the router drop the endpoint before SIGTERM (default 30 s grace period).
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # ADR-0028 §2: /alive checks only the process (PRB-2: a DB outage never restarts the pod);
          # /health includes the database, so readiness drops the pod from the Service instead.
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # Mostly I/O and long-lived watch streams (100m was sized for ~50 users on one pod). The CPU request is the
          # HPA denominator (75 % of it), so changing it moves the scaling point. No CPU limit (throttling would stall
          # streams); the memory limit bounds a leak.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ca-bundle
              mountPath: /etc/consolinho/ca
              readOnly: true
            - name: dp-cert
              mountPath: /etc/consolinho/dp
              readOnly: true
      volumes:
        # The only writable path (readOnlyRootFilesystem): .NET temp files, shared by migrate and server.
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        # Created by the deploy script/operator, not kustomize (ADR-0030 CA bundle; replaces system trust).
        - name: ca-bundle
          configMap:
            name: consolinho-ca-bundle
        # Data Protection key-encryption certificate + password (ADR-0028 §6).
        - name: dp-cert
          secret:
            secretName: consolinho-dp-cert
            defaultMode: 0440
