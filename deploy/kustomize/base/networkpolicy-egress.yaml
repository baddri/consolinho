# K8S-6/Q4: egress of the server pods restricted by port only (destinations of ~40 managed clusters are unknown IPs):
# DNS (53/5353, OpenShift DNS listens on 5353), Postgres 5432, HTTPS 443 (OAuth route) and 6443 (API servers).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: consolinho-egress
  labels:
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: server
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
