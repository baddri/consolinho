# K8S-6: only the OpenShift router (namespaces carrying the ingress policy-group label) may reach the server port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: consolinho-ingress
  labels:
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - protocol: TCP
          port: 8080
