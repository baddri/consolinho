# OPS-1 (ADR-0040 §9): only the consolinho server pods reach Redis, on TCP 6379. The migrate init container runs in
# the same pod but gets no Redis connection string. Matching egress rule: consolinho-egress (networkpolicy-egress.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: consolinho-redis-ingress
  labels:
    app.kubernetes.io/component: redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: 6379
