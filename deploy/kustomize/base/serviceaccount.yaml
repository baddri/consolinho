# Identity of the consolinho pods. The app calls the host cluster with this identity for one thing only: listing the
# host's groups (ADR-0039 §5; RBAC in rbac-group-reader.yaml). Login uses OAuth; proxied calls use the per-user SA
# tokens from the database. No automounted token: the server container alone gets a projected, rotating token at
# /var/run/secrets/fleetconsole/host (deployment.yaml), the migrate init container none.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: consolinho
  labels:
    app.kubernetes.io/component: server
automountServiceAccountToken: false
