# SMK-1: namespaced `view` only — nothing cluster-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: consolinho-smoke-view
  labels:
    app.kubernetes.io/component: smoke
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: consolinho-smoke
    namespace: consolinho
