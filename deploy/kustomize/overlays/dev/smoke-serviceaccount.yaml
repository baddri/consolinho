# SMK-1: read-only identity for the post-deploy smoke test. The human mints a short-lived token for it
# (`oc create token consolinho-smoke`) and registers it in the console as a cluster credential. No automount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: consolinho-smoke
  labels:
    app.kubernetes.io/component: smoke
automountServiceAccountToken: false
