# K8S-7: with replicas: 2, voluntary disruptions (node drains, upgrades) keep at least one pod serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: consolinho
  labels:
    app.kubernetes.io/component: server
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: server
