# EXAMPLE ONLY — NOT referenced by kustomization.yaml and NEVER to be committed with real values (CFG-5).
# Documents the Secrets/ConfigMap the production deployment expects (ADR-0030 configuration contract).
# Create them out of band, e.g. `oc create secret generic ... --from-file=...`; see the deploy runbook
# (docs/ops/RUNBOOK.md) for the exact commands, certificate generation and CA bundle contents.
apiVersion: v1
kind: Secret
metadata:
  name: consolinho-db
  namespace: consolinho
type: Opaque
stringData:
  # Npgsql connection string of the external Postgres (DB-4); used by the server and the migrate init container.
  connection-string: Host=REPLACE_ME;Port=5432;Database=consolinho;Username=REPLACE_ME;Password=REPLACE_ME;SSL Mode=VerifyFull
---
apiVersion: v1
kind: Secret
metadata:
  name: consolinho-oauth
  namespace: consolinho
type: Opaque
stringData:
  # Must equal the `secret` of the cluster-scoped OAuthClient `consolinho`.
  client-secret: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: consolinho-redis
  namespace: consolinho
type: Opaque
stringData:
  # Password of the access-cache Redis (ADR-0040 §9): Redis' --requirepass and, via $(REDIS_PASSWORD), the server's
  # ConnectionStrings__redis. Random, [A-Za-z0-9] only (it is embedded in a connection string), e.g. openssl rand -hex 32.
  password: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: consolinho-dp-cert
  namespace: consolinho
type: Opaque
data:
  # Data Protection key-encryption certificate (PKCS#12, base64) and its password (mounted at /etc/consolinho/dp).
  certificate.pfx: UkVQTEFDRV9NRQ==   # base64("REPLACE_ME")
  password: UkVQTEFDRV9NRQ==          # base64("REPLACE_ME")
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: consolinho-ca-bundle
  namespace: consolinho
data:
  # PEM bundle that REPLACES system trust for the host API (kubernetes.default.svc) and the OAuth route:
  # the cluster's kube-root-ca.crt + the CA signing the OAuth route (incl. a public root CA if it uses one).
  ca-bundle.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_ME
    -----END CERTIFICATE-----
---
# ONLY when the host cluster (login + groups, Auth__OpenShift__HostApiServerUrl) is NOT the cluster consolinho runs on
# (ADR-0039 §5). In-cluster, base mounts a projected token of the consolinho SA instead and this Secret is not needed.
# On the HOST cluster (cluster-admin once): create a ServiceAccount (e.g. consolinho-group-reader in a namespace of your
# choice), apply base/rbac-group-reader.yaml's ClusterRole + a ClusterRoleBinding to that SA, and issue a token for it,
# e.g. `oc create token <sa> -n <ns> --duration=<your rotation period>` (re-create this Secret before it expires; the
# app re-reads the file on every refresh, no restart needed). That token can do nothing but get/list groups.
# Then, in this overlay, replace the projected volume with this Secret at the same path (= Auth:HostGroups:TokenPath);
# the strategic-merge patch matches the volume by name and drops its `projected` source:
#   patches:
#     - target: {kind: Deployment, name: consolinho}
#       patch: |-
#         apiVersion: apps/v1
#         kind: Deployment
#         metadata: {name: consolinho}
#         spec:
#           template:
#             spec:
#               volumes:
#                 - name: host-sa-token
#                   projected: null
#                   secret: {secretName: consolinho-host-sa-token, defaultMode: 0440}
# The ClusterRole/ClusterRoleBinding from base then grant the deploy cluster's consolinho SA a right it never uses;
# drop them from the render with a `$patch: delete` patch if you don't want them there.
apiVersion: v1
kind: Secret
metadata:
  name: consolinho-host-sa-token
  namespace: consolinho
type: Opaque
stringData:
  # Bearer token of the host SA bound to the group-reader ClusterRole (file `token` in the mount).
  token: REPLACE_ME
