# In-cluster k6 run of console-mix.js (T-0242). Not part of the kustomize app; applied by hand in ns consolinho:
#   oc -n consolinho create configmap consolinho-loadtest-script --from-file=deploy/loadtest/console-mix.js
#   oc -n consolinho create secret generic consolinho-loadtest --from-file=cookie=<file holding the Cookie header>
#   oc -n consolinho apply -f deploy/loadtest/job.yaml && oc -n consolinho logs -f job/consolinho-loadtest
# Clean up with: oc -n consolinho delete job/consolinho-loadtest cm/consolinho-loadtest-script secret/consolinho-loadtest
apiVersion: batch/v1
kind: Job
metadata:
  name: consolinho-loadtest
  labels:
    app.kubernetes.io/name: consolinho-loadtest
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: consolinho-loadtest
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: docker.io/grafana/k6:2.3.0
          args: [run, "--summary-trend-stats=avg,med,p(95),p(99),max", /scripts/console-mix.js]
          env:
            - { name: BASE_URL, value: "https://consolinho.apps.example.invalid" } # set with oc set env / sed
            - { name: CLUSTER, value: ocp-tebe }
            - { name: NAMESPACE, value: consolinho }
            - { name: RATES, value: "5,20,40,80,120" }
            - { name: STEP, value: 2m }
            - name: COOKIE
              valueFrom: { secretKeyRef: { name: consolinho-loadtest, key: cookie } }
          resources:
            requests: { cpu: 500m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: script, mountPath: /scripts }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      volumes:
        - name: script
          configMap: { name: consolinho-loadtest-script }
